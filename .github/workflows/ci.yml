name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6 # 版本取自 package.json 的 packageManager
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      # 演练发布:打包内容、workspace 依赖替换、包清单都会被 npm 校验一遍,但不会真正发布
      - name: Release dry run
        run: node scripts/release.mjs --tag "v$(node -p 'require("./packages/core/package.json").version')" --dry-run
